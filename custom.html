<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 시트 서버와 미리 연결해 둔다 -->
<link rel="preconnect" href="https://docs.google.com" crossorigin>
<link rel="dns-prefetch" href="https://docs.google.com">
<title>커스텀 보드</title>
<script src="assets/gsheet.js"></script>
<style>
  :root{ --bg:#f6f7fb; --card:#fff; --card2:#f1f3f9; --bd:#e6e9f0; --tx:#1c2333; --mut:#6b7688;
    --accent:#2f6fed; --purple:#7c53e6; --green:#0f9d6e; --peak:#d97706; --down:#dc2626; }
  :root[data-theme="dark"]{ --bg:#0f1420; --card:#1a2132; --card2:#151c2b; --bd:#2c3752; --tx:#e8ecf5; --mut:#8b96ad;
    --accent:#4f8cff; --purple:#c084fc; --green:#34d399; --peak:#fbbf24; --down:#f87171; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding:14px 16px 60px}
  a{color:var(--accent);text-decoration:none}
  /* 헤더 */
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  h1{font-size:19px;letter-spacing:-.3px}
  h1 span{color:var(--accent)}
  .sub{font-size:12px;color:var(--mut)}
  .nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .btn{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{color:#fff;opacity:.92}
  .btn.warn:hover{border-color:var(--down);color:var(--down)}
  /* 툴바 */
  .bar{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;
    align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:12px}
  .bar b{color:var(--tx)}
  .seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:none;color:var(--mut);padding:5px 10px;font-size:11.5px;cursor:pointer}
  .seg button.active{background:var(--accent);color:#fff;font-weight:600}
  select{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:5px 8px;border-radius:8px;font-size:12px}
  /* 그리드 */
  #grid{display:grid;gap:12px}
  .cell{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .cell.drag{opacity:.45;outline:2px dashed var(--accent)}
  .cell-h{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--card2);flex-wrap:wrap}
  .cell-h .t{font-size:12.5px;font-weight:700}
  .cell-h .g{font-size:10.5px;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;font-weight:600}
  .cell-h .g.all{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:400}
  .cell-h .opt:empty{display:none}
  .cell-h .src{font-size:10.5px;color:var(--mut);border:1px solid var(--bd);border-radius:6px;padding:1px 6px}
  .cell-h .tools{margin-left:auto;display:flex;gap:4px}
  .ic{background:transparent;border:1px solid var(--bd);color:var(--mut);border-radius:7px;padding:2px 7px;font-size:11px;cursor:pointer;line-height:1.5}
  .ic:hover{color:var(--accent);border-color:var(--accent)}
  .ic.del:hover{color:var(--down);border-color:var(--down)}
  .ic.mv{cursor:grab}
  .cell-cfg{display:none;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut)}
  .cell.open .cell-cfg{display:flex}
  .cell iframe{width:100%;border:0;display:block;background:transparent}
  .ph{padding:26px 10px;text-align:center;color:var(--mut);font-size:12px}
  /* 빈 상태 */
  .empty{background:var(--card);border:1px dashed var(--bd);border-radius:14px;padding:34px 20px;text-align:center;color:var(--mut);font-size:13px;line-height:1.9}
  .empty b{color:var(--tx)}
  .presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  /* 카탈로그 모달 */
  .ov{position:fixed;inset:0;background:rgba(10,14,24,.62);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
  .ov.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column}
  .modal h3{font-size:15px;padding:15px 18px 11px;border-bottom:1px solid var(--bd)}
  .modal h3 small{font-weight:400;color:var(--mut);font-size:12px;margin-left:6px}
  .mbody{padding:12px 18px;overflow-y:auto}
  .mfoot{padding:11px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
  .grp-t{font-size:11.5px;color:var(--mut);margin:12px 0 7px;font-weight:600}
  .grp-t:first-child{margin-top:0}
  .pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
  .pk{border:1px solid var(--bd);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--card2)}
  .pk:hover{border-color:var(--accent)}
  .pk .n{font-size:12.5px;font-weight:600}
  .pk .d{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.45}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);
    color:var(--tx);padding:9px 18px;border-radius:10px;font-size:12.5px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.on{opacity:1}
  .foot{color:var(--mut);font-size:11.5px;margin-top:18px;line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>🧩 <span>커스텀</span> 보드</h1>
  <span class="sub" id="sub">필요한 섹션만 골라 한 화면에</span>
  <div class="nav">
    <button class="btn" id="addBtn">➕ 섹션 추가</button>
    <button class="btn" id="loadAllBtn" title="스크롤을 기다리지 않고 담은 섹션을 전부 불러옵니다 (인쇄·캡처용)">⤓ 전체 불러오기</button>
    <button class="btn" id="linkBtn" title="지금 구성을 링크에 담아 복사 — 다른 PC·노션에서 같은 화면">🔗 보드 URL</button>
    <button class="btn" id="secLinkBtn" title="담은 섹션들의 단독 URL 을 한 줄씩 복사 — 노션에 각각 임베드할 때">🔗 섹션 URL 전체</button>
    <button class="btn" id="themeBtn" title="밤/낮 모드">🌙</button>
    <button class="btn warn" id="clearBtn">초기화</button>
    <a class="btn" href="index.html">📊 대시보드</a>
    <a class="btn" href="board.html">🗂️ KPI 현황판</a>
    <a class="btn" href="overview.html">📈 전사 비교</a>
  </div>
</header>

<div class="bar">
  <span>기본 게임 <select id="gameSel"></select></span>
  <span>목표 기준 <span class="seg" id="cbBaseSeg" title="현황판 섹션(④·⑧)의 목표 금액 기준 — 사업계획×비중 / 전체 매출 실측×비중">
    <button data-b="plan" class="active">사업목표</button><button data-b="actual">실적</button>
  </span></span>
  <span>열 <span class="seg" id="colSeg">
    <button data-c="1">1</button><button data-c="2" class="active">2</button><button data-c="3">3</button>
  </span></span>
  <span id="sheetState"></span>
  <span style="margin-left:auto">섹션 카드의 <b>⚙</b> 로 게임·높이·너비를 개별 지정하고, <b>⣿</b> 를 끌어 순서를 바꿉니다</span>
</div>

<div id="grid"></div>
<div class="empty" id="empty" style="display:none">
  아직 담은 섹션이 없습니다. <b>➕ 섹션 추가</b> 로 원하는 섹션을 고르세요.<br>
  KPI 현황판 7개 · 리포트 위젯 9개 · 전체 페이지 3개 중에서 골라 담을 수 있습니다.
  <div class="presets">
    <button class="btn primary" data-preset="exec">경영 보고용 담기</button>
    <button class="btn" data-preset="daily">일일 점검용 담기</button>
    <button class="btn" data-preset="event">이벤트 분석용 담기</button>
  </div>
</div>

<div class="foot" id="foot"></div>

<div class="ov" id="ov">
  <div class="modal">
    <h3>섹션 추가 <small>클릭하면 보드 맨 아래에 담깁니다</small></h3>
    <div class="mbody" id="mbody"></div>
    <div class="mfoot"><button class="btn" id="ovClose">닫기</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   커스텀 보드 — 다른 페이지의 섹션을 iframe 으로 골라 담는 조립 화면
   · KPI 현황판(board.html) 섹션은 ?sec= 단독 임베드를 그대로 사용
   · 리포트 위젯(report.html)은 ?view= 임베드 모드를 사용
   · 데이터는 각 iframe 이 시트에서 직접 읽는다 (이 페이지는 데이터를 다루지 않음)
   =================================================================== */
const qp = new URLSearchParams(location.search);
const CODES = (window.GSheet && GSheet.KNOWN_CODES) ? GSheet.KNOWN_CODES.slice() : [];

/* 시트 URL — ?sheet= > 대시보드 저장값 > 플래너 저장값 */
function sheetUrl(){
  const s = qp.get("sheet"); if(s) return s.trim();
  const id = qp.get("sid"); if(id) return "https://docs.google.com/spreadsheets/d/"+id.trim();
  try{ const j=JSON.parse(localStorage.getItem("d2c-dashboard-v2")); if(j&&j.masterSheetUrl) return j.masterSheetUrl; }catch(e){}
  return localStorage.getItem("kpiplanner-sheet") || "";
}
const SHEET = sheetUrl();

/* 담을 수 있는 섹션 목록 — h=기본 높이(px), w=기본 너비(1|2 열), game=게임 지정 의미 있음 */
const CATALOG = [
  { g:"KPI 현황판 (board)", items:[
    { id:"b:cards",     name:"요약 카드",        d:"전체·자체결제·WEB/APK/PC 합계",         h:250, w:2, game:1 },
    { id:"b:chart",     name:"매출 추이",         d:"채널 스택 + 비중선 + 우측 정보 패널",     h:560, w:2, game:1 },
    { id:"b:kpi",       name:"단계별 KPI",        d:"목표·실적·부족·MPU·우수고객 (기준 탭)",   h:520, w:2, game:1 },
    { id:"b:strategy",  name:"추가 전략 KPI",      d:"목표 부족분 충당 waterfall",            h:620, w:2, game:1 },
    { id:"b:milestone", name:"월별 마일스톤",      d:"하반기 액션 로드맵 카드",               h:360, w:2, game:1 },
    { id:"b:monthly",   name:"월간 지표",          d:"MPU·자체 전환율·ARPPU",                h:560, w:2, game:1 },
    { id:"b:daily",     name:"KPI 일별 트래킹",     d:"매출·MPU 목표 페이스 (탭 4개)",         h:640, w:2, game:1 },
  ]},
  { g:"리포트 위젯 (report)", items:[
    { id:"r:summary", name:"요약 KPI",       d:"기간 합계 카드",              h:250, w:1, game:1, needGame:1 },
    { id:"r:trend",   name:"추이",           d:"매출 + 비중 일별",            h:360, w:1, game:1, needGame:1 },
    { id:"r:channel", name:"채널",           d:"WEB·APK·PC 비교",            h:360, w:1, game:1, needGame:1 },
    { id:"r:monthly", name:"월별 (리포트)",   d:"월 단위 매출·비중",           h:400, w:1, game:1, needGame:1 },
    { id:"r:top",     name:"TOP",            d:"상위 일자",                  h:360, w:1, game:1, needGame:1 },
    { id:"r:target",  name:"KPI 목표",        d:"목표 대비 진척",              h:400, w:1, game:1, needGame:1 },
    { id:"r:daily",   name:"일별 트래킹 (리포트)", d:"일 목표 페이스",          h:420, w:1, game:1, needGame:1 },
    { id:"r:events",  name:"이벤트",          d:"기간 내 이벤트 효과",          h:400, w:1, game:1, needGame:1 },
    { id:"r:country", name:"국가별",          d:"국가 매출 분포",              h:400, w:1, game:1, needGame:1 },
  ]},
  { g:"메인 대시보드 (index)", items:[
    { id:"i:cards",    name:"KPI 카드",        d:"기간 합계·직전 대비·성장률",        h:250, w:2, game:1 },
    { id:"i:rev",      name:"일별 매출 & 비중",  d:"막대=매출 · 선=비중 · 피크 TOP5",   h:420, w:2, game:1 },
    { id:"i:ratio",    name:"비중 추이",        d:"7일 이동평균 + 목표선",            h:380, w:1, game:1 },
    { id:"i:puarppu",  name:"PU & ARPPU",      d:"막대=PU · 선=ARPPU",              h:380, w:1, game:1 },
    { id:"i:weekly",   name:"주별 매출",         d:"월요일 시작 주 단위 합계",          h:380, w:1, game:1 },
    { id:"i:weeklyM",  name:"월별 매출",         d:"달력 월 단위 합계(전체 기간)",       h:380, w:1, game:1 },
    { id:"i:putrend",  name:"PU 추이",          d:"7일 이동평균",                    h:380, w:1, game:1 },
    { id:"i:table",    name:"일별 상세 표",       d:"날짜별 매출·비중·PU·ARPPU",        h:460, w:2, game:1 },
    { id:"i:tableM",   name:"월별 상세 표",       d:"월별 합계 + 전월 대비(전체 기간)",    h:400, w:2, game:1 },
  ]},
  { g:"전사 비교 (overview)", items:[
    { id:"o:ovcards", name:"프로젝트 카드",     d:"게임별 자체결제 PU비중 + 연초 대비",  h:200, w:2 },
    { id:"o:ovtable", name:"지표별 비교 표",     d:"지표 5종 × 월별 · 금액 펼치기",      h:520, w:2 },
    { id:"o:ovchart", name:"지표 추이 차트",     d:"선택 지표 월별 라인",               h:420, w:2 },
  ]},
  { g:"전체 페이지", items:[
    { id:"p:overview", name:"전사 비교(전체)",   d:"카드+표+차트 한 페이지",     h:760, w:2 },
    { id:"p:planner",  name:"KPI 플래너",      d:"하반기 목표 시뮬레이터",      h:780, w:2 },
    { id:"p:events",   name:"이벤트 효과 분석", d:"메인 대시보드 이벤트 페이지",  h:640, w:2 },
  ]},
];
const DEF = {}; CATALOG.forEach(g=>g.items.forEach(i=>DEF[i.id]=i));

/* 프리셋 — 자주 쓰는 조합 */
const PRESETS = {
  exec:  ["b:cards","b:kpi","b:chart","b:monthly"],
  daily: ["b:cards","b:daily","b:chart","r:trend"],
  event: ["p:events","b:chart","r:events","b:cards"],
};

/* ===== 상태 ===== */
const LS = "custom-board-v1";
let items = [];              // [{id, game, h, w}]
let cols = 2;
let baseGame = "";           // 기본 게임 (빈 값 = 전체 프로젝트)
let kpiBaseSel = "plan";     // 현황판 섹션의 목표 기준 (plan | actual)
let theme = "dark";

function load(){
  // URL 우선 — 공유 링크로 열면 그 구성 그대로
  const w = qp.get("w");
  if(w){
    items = w.split(",").filter(Boolean).map(s=>{
      const [id,game,h,wd,lv] = s.split("~");
      if(!DEF[id]) return null;
      const o = { id, game: game||"", h: +h||DEF[id].h, w: +wd||DEF[id].w };
      const live = decLive(lv); if(live) o.live = live;    // 복사 당시 섹션 옵션
      return o;
    }).filter(Boolean);
    cols = +qp.get("cols") || 2;
    baseGame = qp.get("proj") || "";
    kpiBaseSel = qp.get("kbase") === "actual" ? "actual" : "plan";
    theme = qp.get("theme") || localStorage.getItem("board-theme") || "dark";
    return;
  }
  try{
    const s = JSON.parse(localStorage.getItem(LS));
    if(s){
      items = (s.items||[]).filter(x=>DEF[x.id]);
      cols = s.cols || 2;
      baseGame = s.baseGame || "";
      kpiBaseSel = s.kpiBaseSel === "actual" ? "actual" : "plan";
    }
  }catch(e){}
  theme = localStorage.getItem("board-theme") || "dark";
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify({items, cols, baseGame, kpiBaseSel})); }catch(e){}
}

/* ===== 렌더 ===== */
/* 섹션 단독 URL(절대주소) — 노션 임베드용. iframeSrc 가 it.live 를 반영하므로
   섹션 안에서 게임·기간을 바꿔놓고 복사하면 그 화면이 그대로 담긴다 */
function secUrl(it){ return new URL(iframeSrc(it), location.href).href; }
/* 카드 머리말에 지금 옵션을 적어 둔다 — 무엇이 복사될지 눈으로 확인하려는 것 */
const MET_NAME = { revShare:"매출비중", puShare:"PU비중", totARPPU:"전체 ARPPU", d2cARPPU:"자체 ARPPU", totPU:"전체 PU" };
function gameLabel(it){
  const lv = liveOf(it);
  if(lv && lv.game !== undefined) return lv.game === "ALL" ? "" : lv.game;
  if(lv && lv.proj !== undefined) return lv.proj;
  return it.game || baseGame;
}
function optLabel(it){
  const lv = liveOf(it), src = it.id.split(":")[0];
  if(src === "i"){
    const q = lv || {};
    if(q.month) return +q.month.slice(5) + "월";
    if(q.from || q.to) return "기간 지정";
    const d = q.days != null ? +q.days : (/M$/.test(it.id) ? 0 : 30);
    return d ? d + "일" : "전체 기간";
  }
  if(src === "b") return ((lv && lv.kbase) || kpiBaseSel) === "actual" ? "실적 기준" : "사업목표 기준";
  if(src === "o") return (lv && MET_NAME[lv.met]) || "";
  return "";
}
/* 섹션별 옵션을 링크에 담는 짧은 표기 — "game=GBTW;days=30" */
function encLive(lv){
  if(!lv) return "";
  return Object.keys(lv).filter(k => lv[k] !== "" && lv[k] != null).map(k => k + "=" + lv[k]).join(";");
}
function decLive(s){
  if(!s) return null;
  const o = {};
  s.split(";").forEach(kv => { const i = kv.indexOf("="); if(i > 0) o[kv.slice(0,i)] = kv.slice(i+1); });
  return Object.keys(o).length ? o : null;
}
/* 클립보드 복사 — 실패하면 주소창에 띄워 직접 복사하게 한다 */
function copyText(text, msg){
  navigator.clipboard.writeText(text).then(()=>toast(msg))
    .catch(()=>prompt("아래 주소를 복사하세요.", text));
}
/* 배포 버전 — iframe URL 에 붙여 브라우저가 옛 섹션을 캐시해 두는 것을 막는다 */
const CB_VER = "1.29.0";
/* 섹션 안에서 바꾼 옵션(it.live) — 섹션이 postMessage 로 알려준 지금 화면.
   🔗 복사·새 탭·다음 로드가 모두 이 값을 따르므로 "보던 그대로" 열린다. */
function liveOf(it){ return (it && it.live && typeof it.live === "object") ? it.live : null; }
function iframeSrc(it){
  const d = DEF[it.id];
  const [src, key] = it.id.split(":");
  const lv = liveOf(it);
  const game = it.game || baseGame;
  const p = new URLSearchParams();
  if(SHEET) p.set("sheet", SHEET);
  p.set("theme", theme);
  p.set("v", CB_VER);
  if(src === "b"){
    p.set("sec", key);
    const pj = lv && lv.proj !== undefined ? lv.proj : game;
    if(pj) p.set("proj", pj);
    p.set("kbase", (lv && lv.kbase) || kpiBaseSel);   // 목표 기준 — 섹션 안에서 바꿨으면 그 값
    return "board.html?" + p.toString();
  }
  if(src === "r"){
    p.set("view", key);
    p.set("game", game || CODES[0] || "POTC");   // 리포트 위젯은 game 필수
    p.set("period", "30");
    p.set("wid", "cb-" + key + "-" + (game||"base"));
    return "report.html?" + p.toString();
  }
  if(src === "o"){
    p.set("sec", key);
    if(lv && lv.met)  p.set("met", lv.met);          // 섹션 안에서 고른 지표·연도
    if(lv && lv.year) p.set("year", lv.year);
    return "overview.html?" + p.toString();
  }
  if(src === "i"){
    // weeklyM / tableM = 같은 섹션의 월별 모드 (전체 기간)
    p.set("sec", key === "weeklyM" ? "weekly" : key === "tableM" ? "table" : key);
    if(lv){
      // 섹션 안 컨트롤로 바꿔놓은 게임·기간을 그대로 (전체 프로젝트면 game=ALL)
      if(lv.game) p.set("game", lv.game);
      if(lv.month) p.set("month", lv.month);
      else if(lv.from || lv.to){ if(lv.from) p.set("from", lv.from); if(lv.to) p.set("to", lv.to); }
      else p.set("days", lv.days != null ? String(lv.days) : "30");
      if(lv.tbl) p.set("tbl", lv.tbl);
      if(lv.wk)  p.set("wk",  lv.wk);
    } else {
      if(game) p.set("game", game);
      if(key === "weeklyM"){ p.set("wk", "month"); p.set("days", "0"); }
      else if(key === "tableM"){ p.set("tbl", "month"); p.set("days", "0"); }
      else p.set("days", "30");
    }
    return "index.html?" + p.toString();
  }
  if(it.id === "p:overview") return "overview.html?" + p.toString();
  if(it.id === "p:planner")  return "kpi-planner.html?" + p.toString();
  if(it.id === "p:events"){ p.set("view","events"); p.set("embed","1"); return "index.html?" + p.toString(); }
  return "about:blank";
}

function render(){
  document.documentElement.dataset.theme = theme;
  document.getElementById("themeBtn").textContent = theme === "dark" ? "🌙" : "☀️";
  document.getElementById("grid").style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
  document.querySelectorAll("#colSeg button").forEach(b=>b.classList.toggle("active", +b.dataset.c===cols));
  document.querySelectorAll("#cbBaseSeg button").forEach(b=>b.classList.toggle("active", b.dataset.b===kpiBaseSel));
  document.getElementById("empty").style.display = items.length ? "none" : "";
  document.getElementById("sheetState").innerHTML = SHEET
    ? `시트 연결됨 · 각 섹션이 직접 읽습니다`
    : `<b style="color:var(--down)">연결된 시트가 없습니다</b> — 대시보드/현황판에서 시트를 먼저 연결하세요`;

  const grid = document.getElementById("grid");
  grid.innerHTML = items.map((it,i)=>{
    const d = DEF[it.id];
    const gl = gameLabel(it), ol = optLabel(it);
    const span = Math.min(it.w||d.w, cols);
    return `<div class="cell" data-i="${i}" style="grid-column:span ${span}">
      <div class="cell-h">
        <button class="ic mv" draggable="true" title="끌어서 순서 변경">⣿</button>
        <span class="t">${d.name}</span>
        <span class="g${gl?"":" all"}">${gl||"전체"}</span>
        <span class="src opt" title="지금 이 섹션이 보고 있는 옵션 — 🔗 로 복사하면 이대로 열립니다">${ol}</span>
        <span class="src">${it.id.startsWith("b:")?"현황판":it.id.startsWith("r:")?"리포트":"페이지"}</span>
        <span class="tools">
          <button class="ic cfg" title="게임·높이·너비">⚙</button>
          <button class="ic up" title="위로">▲</button>
          <button class="ic dn" title="아래로">▼</button>
          <button class="ic lnk" title="이 섹션만 열리는 URL 복사 — 노션에 붙이면 그대로 임베드됩니다">🔗</button>
          <button class="ic new" title="새 탭에서 열기">↗</button>
          <button class="ic del" title="빼기">✕</button>
        </span>
      </div>
      <div class="cell-cfg">
        <span>게임 <select class="cg">
          <option value=""${!it.game?" selected":""}>기본(${baseGame||"전체"})</option>
          ${CODES.map(c=>`<option value="${c}"${it.game===c?" selected":""}>${c}</option>`).join("")}
        </select></span>
        <span>높이 <select class="ch">
          ${[280,360,440,520,620,760,900].map(h=>`<option value="${h}"${(it.h||d.h)===h?" selected":""}>${h}px</option>`).join("")}
        </select></span>
        <span>너비 <select class="cw">
          <option value="1"${(it.w||d.w)===1?" selected":""}>1열</option>
          <option value="2"${(it.w||d.w)===2?" selected":""}>2열</option>
        </select></span>
        <span style="color:var(--mut)">${d.d}</span>
      </div>
      <div class="ph">스크롤하면 불러옵니다…</div>
    </div>`;
  }).join("");

  bindCells();
  observeCells();
  document.getElementById("foot").innerHTML = items.length
    ? `섹션 ${items.length}개 · 각 섹션은 화면에 보일 때 불러옵니다(지연 로드) · 같은 시트 탭은 한 번만 읽어 섹션끼리 나눠 씁니다<br>
       <b style="color:var(--tx)">노션에 넣을 때</b> — 카드의 <b>🔗</b> 로 그 섹션만 열리는 주소를 복사해 노션에서 <b>/embed</b> 로 붙이세요(여러 개면 상단 <b>🔗 섹션 URL 전체</b>). 보드 전체를 한 장으로 넣으려면 <b>🔗 보드 URL</b> 을 쓰면 됩니다<br>
       섹션 <b>안에서</b> 게임·기간·목표 기준을 바꾸면 그 상태가 카드 머리말에 표시되고 <b>🔗</b> 복사·다음 로드에 그대로 따라갑니다. 상단의 <b>기본 게임</b>·<b>목표 기준</b>을 바꾸면 섹션별로 잡아둔 옵션은 초기화됩니다`
    : "";
}

function bindCells(){
  document.querySelectorAll("#grid .cell").forEach(cell=>{
    const i = +cell.dataset.i;
    cell.querySelector(".cfg").addEventListener("click",()=>cell.classList.toggle("open"));
    cell.querySelector(".del").addEventListener("click",()=>{ items.splice(i,1); save(); render(); });
    cell.querySelector(".up").addEventListener("click",()=>move(i,-1));
    cell.querySelector(".dn").addEventListener("click",()=>move(i,1));
    cell.querySelector(".new").addEventListener("click",()=>window.open(iframeSrc(items[i]),"_blank"));
    cell.querySelector(".lnk").addEventListener("click",()=>copyText(secUrl(items[i]), DEF[items[i].id].name+" 섹션 URL 복사 — 노션에 붙여넣으면 임베드됩니다"));
    // ⚙ 로 게임을 직접 고르면 섹션 안에서 잡아둔 옵션은 버린다 (지정이 무시되면 고장처럼 보이므로)
    cell.querySelector(".cg").addEventListener("change",e=>{ items[i].game=e.target.value; delete items[i].live; save(); render(); });
    cell.querySelector(".ch").addEventListener("change",e=>{ items[i].h=+e.target.value; save(); render(); });
    cell.querySelector(".cw").addEventListener("change",e=>{ items[i].w=+e.target.value; save(); render(); });
    // 드래그로 순서 변경
    const h = cell.querySelector(".mv");
    h.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain", i); cell.classList.add("drag"); });
    h.addEventListener("dragend",()=>cell.classList.remove("drag"));
    cell.addEventListener("dragover",e=>e.preventDefault());
    cell.addEventListener("drop",e=>{
      e.preventDefault();
      const from = +e.dataTransfer.getData("text/plain");
      if(isNaN(from)||from===i) return;
      const [x] = items.splice(from,1); items.splice(i,0,x); save(); render();
    });
  });
}
/* 섹션(iframe) 이 "지금 이 옵션을 보고 있다"고 알려오면 그대로 기억해 둔다.
   iframe 을 다시 불러오지 않고 머리말만 고쳐 쓴다 — 차트가 깜빡이지 않게. */
window.addEventListener("message", e=>{
  if(e.origin !== location.origin) return;
  const d = e.data;
  if(!d || d.__d2c !== "secState" || !d.p) return;
  const cell = [...document.querySelectorAll("#grid .cell")]
    .find(c=>{ const f = c.querySelector("iframe"); return f && f.contentWindow === e.source; });
  if(!cell) return;
  const it = items[+cell.dataset.i]; if(!it) return;
  if(JSON.stringify(it.live || null) === JSON.stringify(d.p)) return;   // 값이 그대로면 저장도 건너뛴다
  it.live = d.p; save();
  const gl = gameLabel(it);
  const g = cell.querySelector(".cell-h .g");
  if(g){ g.textContent = gl || "전체"; g.classList.toggle("all", !gl); }
  const o = cell.querySelector(".cell-h .opt");
  if(o) o.textContent = optLabel(it);
});
function clearLive(){ items.forEach(it=>{ delete it.live; }); }
function move(i,d){
  const j = i+d; if(j<0||j>=items.length) return;
  const [x] = items.splice(i,1); items.splice(j,0,x); save(); render();
}

/* 지연 로드 — 화면에 들어올 때 iframe 을 만든다 */
let io = null;
function loadCell(cell){
  if(!cell || cell.querySelector("iframe")) return false;
  const it = items[+cell.dataset.i]; if(!it) return false;
  const f = document.createElement("iframe");
  f.src = iframeSrc(it);
  f.style.height = (it.h || DEF[it.id].h) + "px";
  f.loading = "lazy";
  f.title = DEF[it.id].name;
  const ph = cell.querySelector(".ph"); if(ph) ph.remove();
  cell.appendChild(f);
  if(io) io.unobserve(cell);
  return true;
}
function loadAllCells(){
  let n = 0;
  document.querySelectorAll("#grid .cell").forEach(c=>{ if(loadCell(c)) n++; });
  return n;
}
function observeCells(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting) loadCell(e.target); });
  }, { rootMargin: "300px" });
  document.querySelectorAll("#grid .cell").forEach(c=>io.observe(c));
}

/* ===== 카탈로그 ===== */
function openCatalog(){
  document.getElementById("mbody").innerHTML = CATALOG.map(g=>`
    <div class="grp-t">${g.g}</div>
    <div class="pick">${g.items.map(i=>`
      <div class="pk" data-add="${i.id}"><div class="n">${i.name}</div><div class="d">${i.d}</div></div>`).join("")}</div>`).join("");
  document.querySelectorAll("#mbody .pk").forEach(p=>p.addEventListener("click",()=>{
    const d = DEF[p.dataset.add];
    items.push({ id:p.dataset.add, game:"", h:d.h, w:d.w });
    save(); render(); toast(d.name+" 담았습니다");
  }));
  document.getElementById("ov").classList.add("on");
}
function toast(m){
  const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),1800);
}

/* ===== 이벤트 ===== */
document.getElementById("addBtn").addEventListener("click", openCatalog);
document.getElementById("secLinkBtn").addEventListener("click", ()=>{
  if(!items.length) return toast("담은 섹션이 없습니다");
  const lines = items.map(it => `${DEF[it.id].name}${it.game?" ("+it.game+")":""}\t${secUrl(it)}`);
  copyText(lines.join("\n"), `섹션 ${items.length}개 URL 복사 — 노션에 붙여넣고 각각 임베드하세요`);
});
document.getElementById("loadAllBtn").addEventListener("click", ()=>{
  const n = loadAllCells();
  toast(n ? n+"개 섹션을 불러옵니다" : "이미 다 불러왔습니다");
});
document.getElementById("ovClose").addEventListener("click", ()=>document.getElementById("ov").classList.remove("on"));
document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") e.currentTarget.classList.remove("on"); });
document.getElementById("themeBtn").addEventListener("click", ()=>{
  theme = theme==="dark" ? "light" : "dark";
  try{ localStorage.setItem("board-theme", theme); }catch(e){}
  render();
});
document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(!items.length || !confirm("담은 섹션을 모두 비울까요?")) return;
  items = []; save(); render();
});
document.querySelectorAll("#colSeg button").forEach(b=>b.addEventListener("click",()=>{
  cols = +b.dataset.c; save(); render();
}));
document.querySelectorAll("#cbBaseSeg button").forEach(b=>b.addEventListener("click",()=>{
  // 상단에서 기준을 바꾸면 전체에 다시 적용한다 — 섹션별로 따로 잡아둔 옵션은 초기화
  kpiBaseSel = b.dataset.b; clearLive(); save(); render();
}));
document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{
  items = PRESETS[b.dataset.preset].map(id=>({ id, game:"", h:DEF[id].h, w:DEF[id].w }));
  save(); render(); toast("프리셋을 담았습니다");
}));
document.getElementById("linkBtn").addEventListener("click", ()=>{
  const p = new URLSearchParams();
  if(SHEET) p.set("sheet", SHEET);
  p.set("w", items.map(it=>[it.id, it.game, it.h, it.w, encLive(liveOf(it))].join("~")).join(","));
  p.set("cols", cols);
  p.set("kbase", kpiBaseSel);
  if(baseGame) p.set("proj", baseGame);
  p.set("theme", theme);
  const url = location.origin + location.pathname + "?" + p.toString();
  navigator.clipboard.writeText(url).then(()=>toast("링크를 복사했습니다 — 다른 PC·노션에서 같은 구성"))
    .catch(()=>prompt("복사에 실패했습니다. 아래 주소를 직접 복사하세요.", url));
});

load();

/* 기본 게임 셀렉트 */
(function(){
  const s = document.getElementById("gameSel");
  s.innerHTML = `<option value="">전체 프로젝트</option>` + CODES.map(c=>`<option value="${c}">${c}</option>`).join("");
  s.value = baseGame;
  s.addEventListener("change", e=>{ baseGame = e.target.value; clearLive(); save(); render(); });
})();

render();
</script>
